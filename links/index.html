<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Alex Esumei — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0B10; --surface: #14161F; --border: rgba(255,255,255,0.08);
    --text: #F2F3F7; --text-dim: #9297A8;
    --violet: #8B5CF6; --cyan: #22D3EE;
    --grad-brand: linear-gradient(120deg, var(--violet), var(--cyan));
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    min-height: 100dvh; display:flex; align-items:center; justify-content:center;
    padding: 40px 20px;
  }
  .wrap{ max-width: 420px; width:100%; text-align:center; }
  .ring-wrap{ position:relative; width:110px; height:110px; margin: 0 auto 18px; }
  .ring-svg{ position:absolute; inset:0; width:100%; height:100%; transform: rotate(-90deg); }
  .ring-track{ fill:none; stroke: rgba(255,255,255,.08); stroke-width: 3; }
  .ring-arc{ fill:none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 640 100; }
  .ring-photo{
    position:absolute; inset: 8px; border-radius:50%; overflow:hidden;
    border: 3px solid var(--bg);
  }
  .ring-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  h1{ font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; }
  .sub{ color: var(--text-dim); font-size: .9rem; margin-bottom: 30px; }
  .links{ display:flex; flex-direction:column; gap: 12px; }
  .link-btn{
    display:block; text-decoration:none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; font-weight:600; font-size: .98rem;
    transition: transform .18s ease, border-color .18s ease;
  }
  .link-btn:hover{ transform: translateY(-2px); border-color: var(--violet); }
  .link-btn.primary{ background: var(--grad-brand); color: #06070A; border:none; }
  .footer{ margin-top: 30px; color: #5C6070; font-size: .78rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F58529"/>
            <stop offset="35%" stop-color="#DD2A7B"/>
            <stop offset="70%" stop-color="#8134AF"/>
            <stop offset="100%" stop-color="#22D3EE"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="110" cy="110" r="102"/>
        <circle class="ring-arc" cx="110" cy="110" r="102" stroke="url(#igGradient)"/>
      </svg>
      <div class="ring-photo"><img src="../assets/profile.jpg" alt="Prince Alex Esumei"></div>
    </div>
    <h1>Prince Alex Esumei</h1>
    <p class="sub">AI &amp; Full-Stack Developer · Port Harcourt, Nigeria</p>

    <div class="links">
      <a class="link-btn primary" href="https://prince-alex-portfolio.netlify.app" target="_blank" rel="noopener">🌐 My Portfolio</a>
      <a class="link-btn" href="mailto:princealexesumei@gmail.com">✉️ Email Me</a>
      <a class="link-btn" href="https://github.com/jiggyprince" target="_blank" rel="noopener">💻 GitHub</a>
      <a class="link-btn" href="https://tinyurl.com/axderone" target="_blank" rel="noopener">🤖 Axder One — Join the Waitlist</a>
    </div>

    <p class="footer">© <span id="year"></span> Prince Alex Esumei</p>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
